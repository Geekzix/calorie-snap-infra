apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: banking-apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.11.0
          ports:
            - containerPort: 80
---

apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: banking-apps
spec:
  selector:
    app: whoami
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
