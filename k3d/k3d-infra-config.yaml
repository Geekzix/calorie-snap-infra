apiVersion: k3d.io/v1alpha5
kind: Simple

metadata:
  name: demo-micro-lab

servers: 1
agents: 2

image: rancher/k3s:v1.31.5-k3s1

ports:
  - port: 8088:80
    nodeFilters:
      - loadbalancer

  - port: 8448:443
    nodeFilters:
      - loadbalancer

options:
  k3d:
    wait: true
    timeout: 180s

  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:*

  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
