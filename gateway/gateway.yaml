apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: banking-gateway
  namespace: traefik
  labels:
    app.kubernetes.io/part-of: banking-platform
spec:
  gatewayClassName: traefik-banking
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
