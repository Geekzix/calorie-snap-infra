apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami-route
  namespace: banking-apps
spec:
  parentRefs:
    - name: traefik-gateway #banking-gateway
      namespace: traefik
      sectionName: web #http 
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: whoami
          port: 80
