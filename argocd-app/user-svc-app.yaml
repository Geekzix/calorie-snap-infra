apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-svc-testing
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Geekzix/calorie-snap-user-service.git'
    targetRevision: main
    path: helm/user-svc
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: testing
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
