api:
  dashboard: true
  insecure: true # should be false in prod
providers:
  kubernetesIngress:
     enabled: false
  kubernetesGateway:
     enabled: true
rbac:
  enabled: true

gateway:
  enabled: true
  listeners:
    web:
      port: 80
      protocol: HTTP
      namespacePolicy:
        from: All
ports:
  web:
    port: 80
    containerPort: 80
  websecure:
    port: 443
    containerPort: 443
  traefik:
    port: 8000
    containerPort: 8000
